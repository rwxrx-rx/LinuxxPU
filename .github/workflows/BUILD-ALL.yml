name: Build LinuxxPU Kernel & Manager (Xiaomi Camellia)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Pilih jenis kompilasi'
        required: true
        default: 'build_all'
        type: choice
        options:
          - build_all
          - only_kernel
          - only_manager

      ksu_fork:
        description: 'Which KSU fork should be used?'
        required: true
        default: 'xxksu'
        type: choice
        options:
          - xxksu
          - sukisu
          - ksunext

      # Opsi Support Additional Manager Signatures
      additional_ksu_support:
        description: 'Support for additional managers?'
        required: true
        type: choice
        default: 'All managers'
        options:
          - 'All managers'
          - 'none'
          - 'official'
          - 'rsuntk'
          - 'backslashxx'
          - 'kernelsu-next'
          - 'mksu'
          - 'sukisu'
          - 'wild-ksun'
          - 'kowx712-ksu'

      include_susfs:
        description: 'Includes SUSFS patch (kernel-4.14)?'
        required: true
        default: true
        type: boolean

      toolchain_variant:
        description: 'Toolchain Clang/LLVM variant'
        required: true
        default: 'aosp-clang-11'
        type: choice
        options:
          - 'aosp-clang-11'
          - 'aosp-clang-12'
          - 'proton-clang'

      bbg_option:
        description: 'BBG (Base Build Group / Custom flags)'
        required: false
        default: 'standard'
        type: string

jobs:
  calc_tag_version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gen_tag.outputs.tag }}
    steps:
      - name: Generate Tag Version
        id: gen_tag
        run: |
          echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

  build-kernel:
    if: inputs.build_type == 'build_all' || inputs.build_type == 'only_kernel'
    runs-on: ubuntu-latest
    env:
      KERNEL_SOURCE: "https://github.com/rwxrx-rx/kernel_xiaomi_camellia"
      KERNEL_BRANCH: "main"
      KERNEL_DEFCONFIG: "camellia_defconfig"
      ARCH: "arm64"
      KSU_FORK: ${{ inputs.ksu_fork }}
      ADDITIONAL_KSU_SUPPORT: ${{ inputs.additional_ksu_support }}
      USE_SUSFS: ${{ inputs.include_susfs }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip unzip git ccache

      - name: Download Toolchain (${{ inputs.toolchain_variant }})
        run: |
          mkdir -p toolchain
          cd toolchain
          
          if [ "${{ inputs.toolchain_variant }}" = "proton-clang" ]; then
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          else
            wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz
            mkdir clang && tar -xf clang-r383902.tar.gz -C clang
          fi
          
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_SOURCE }} kernel-source

      - name: Setup Selected KSU Fork (${{ inputs.ksu_fork }})
        run: |
          cd kernel-source
          
          if [ "${{ inputs.ksu_fork }}" = "xxksu" ]; then
            echo "Menggunakan xxKSU Fork..."
            curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/main/kernel/setup.sh" | bash -s main
          elif [ "${{ inputs.ksu_fork }}" = "sukisu" ]; then
            echo "Menggunakan SukiSU Fork..."
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          else
            echo "Menggunakan KernelSU-Next..."
            curl -LSs "https://raw.githubusercontent.com/rifs33/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          fi

      - name: Apply Manager Signatures Support (${{ inputs.additional_ksu_support }})
        run: |
          cd kernel-source
          echo "Menyetting dukungan signature manager: ${{ inputs.additional_ksu_support }}"
          # Jika skrip pembantu signature kamu tersimpan di repo, panggil di sini
          if [ -f "../scripts/apply_signatures.sh" ]; then
            bash ../scripts/apply_signatures.sh "${{ inputs.additional_ksu_support }}"
          fi

      - name: Apply SUSFS Patch (Kernel 4.14)
        if: inputs.include_susfs == true
        run: |
          cd kernel-source
          echo "Penerapan Patch SUSFS untuk 4.14..."
          if [ -d "../patches/susfs_4.14" ]; then
            cp -r ../patches/susfs_4.14/* .
          fi

      - name: Build Kernel Image
        run: |
          cd kernel-source
          export PATH=$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH
          
          make O=out ARCH=${{ env.ARCH }} ${{ env.KERNEL_DEFCONFIG }}
          make -j$(nproc --all) O=out \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld

      - name: Package with AnyKernel3 (Camellia)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          sed -i 's/device.name1=.*/device.name1=camellia/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=camellian/' AnyKernel3/anykernel.sh
          sed -i 's|block=.*|block=/dev/block/by-name/boot|' AnyKernel3/anykernel.sh
          
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          fi

          cd AnyKernel3
          zip -r9 ../LinuxxPU-Camellia-${{ inputs.ksu_fork }}.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinuxxPU-Camellia-${{ inputs.ksu_fork }}
          path: LinuxxPU-Camellia-${{ inputs.ksu_fork }}.zip

  build-manager:
    if: inputs.build_type == 'build_all' || inputs.build_type == 'only_manager'
    needs: calc_tag_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Force Fix AIDL Directory Structure
        run: |
          echo "=== FIX AIDL DIRECTORY ==="
          AIDL_BASE="manager/app/src/main/aidl"
          
          if [ -d "$AIDL_BASE" ]; then
            find "$AIDL_BASE" -type f -name "*.aidl" -exec sed -i 's/\r$//' {} +
            
            OLD_DIR="$AIDL_BASE/me/weishu/kernelsu"
            NEW_DIR="$AIDL_BASE/com/ahmad/linuxxpu"
            
            if [ -d "$OLD_DIR" ]; then
              mkdir -p "$NEW_DIR"
              mv "$OLD_DIR"/* "$NEW_DIR"/ 2>/dev/null || true
              rm -rf "$AIDL_BASE/me"
            fi
            
            find "$AIDL_BASE" -type d -empty -delete
          fi

      - name: Build Manager APK
        working-directory: ./manager
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleRelease
          fi

      - name: Upload Manager Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinuxxPU-Manager-APK
          path: manager/app/build/outputs/apk/release/*.apk

  publish-release:
    needs: [calc_tag_version, build-kernel, build-manager]
    if: always() && (needs.build-kernel.result == 'success' || needs.build-manager.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release via GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.calc_tag_version.outputs.tag }}"
          
          mkdir -p final-assets
          find release-assets -type f \( -name "*.zip" -o -name "*.apk" \) -exec cp {} final-assets/ \;
          
          gh release create "$TAG_NAME" final-assets/* \
            --title "LinuxxPU Kernel & Manager - $TAG_NAME" \
            --notes "Build otomatis untuk Xiaomi Camellia (${{ inputs.ksu_fork }} | Manager Support: ${{ inputs.additional_ksu_support }})." \
            --clobber
            
