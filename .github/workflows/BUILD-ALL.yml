name: Build LinuxxPU Kernel & Manager (Xiaomi Camellia)

# Memberikan izin write ke caller workflow agar diwarisi oleh MY-gki-kernel.yml
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      Build_type:
        type: choice
        description: 'What should be built?'
        default: 'build_all'
        required: true
        options:
          - build_all
          - only_kernel
          - only_manager

      ksu_fork:
        type: choice
        description: 'Which ksu fork should be made?'
        default: 'xxKSU'
        required: true
        options:
          - xxKSU
          - SUKISU

      kernel_variant:
        description: 'Which kernel should be built?'
        required: true
        type: choice
        default: xiaomi-camellia
        options:
          - xiaomi-camellia
          - flyme
          - vortex-v1
          - vortex-test
          - lineage-23.2

      additional_ksu_support:
        description: 'Support for additional managers?'
        required: true
        type: choice
        default: 'All managers'
        options:
          - 'All managers'
          - 'none'
          - 'official'
          - 'rsuntk'
          - 'backslashxx'
          - 'kernelsu-next'
          - 'mksu'
          - 'sukisu'
          - 'wild-ksun'
          - 'kowx712-ksu'

      clang_toolchain:
        description: 'Kernel Toolchain (official AOSP or proton-clang)'
        required: true
        type: choice
        default: 'custom_clang/llvm'
        options:
          - 'official'
          - 'custom_clang/llvm'

      BBG:
        description: 'Include Baseband-Guard (BBG)'
        required: true
        type: boolean
        default: false

      include_susfs:
        description: 'Include SUSFS patch & configs'
        type: boolean
        required: true
        default: false

jobs:
  calc_tag_version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.gen_tag.outputs.tag }}
    steps:
      - name: Generate Tag Version
        id: gen_tag
        run: |
          echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

  call-kernel-build:
    if: inputs.Build_type == 'build_all' || inputs.Build_type == 'only_kernel'
    uses: ./.github/workflows/MY-gki-kernel.yml
    with:
      kernel_variant: ${{ inputs.kernel_variant }}
      ksu_fork: ${{ inputs.ksu_fork }}
      include_susfs: ${{ inputs.include_susfs }}
      clang_toolchain: ${{ inputs.clang_toolchain }}
      manager_supports: ${{ inputs.additional_ksu_support }}
      BBG: ${{ inputs.BBG }}

  build-manager:
    if: inputs.Build_type == 'build_all' || inputs.Build_type == 'only_manager'
    needs: calc_tag_version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Force Fix AIDL Directory Structure
        run: |
          echo "=== FIX AIDL DIRECTORY ==="
          AIDL_BASE="manager/app/src/main/aidl"
          
          if [ -d "$AIDL_BASE" ]; then
            find "$AIDL_BASE" -type f -name "*.aidl" -exec sed -i 's/\r$//' {} +
            
            OLD_DIR="$AIDL_BASE/me/weishu/kernelsu"
            NEW_DIR="$AIDL_BASE/com/ahmad/linuxxpu"
            
            if [ -d "$OLD_DIR" ]; then
              mkdir -p "$NEW_DIR"
              mv "$OLD_DIR"/* "$NEW_DIR"/ 2>/dev/null || true
              rm -rf "$AIDL_BASE/me"
            fi
            
            find "$AIDL_BASE" -type d -empty -delete
          fi

      - name: Build Manager APK
        working-directory: ./manager
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleRelease
          fi

      - name: Upload Manager Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinuxxPU-Manager-APK
          path: manager/app/build/outputs/apk/release/*.apk

  publish-release:
    needs: [calc_tag_version, call-kernel-build, build-manager]
    if: always() && (needs.call-kernel-build.result == 'success' || needs.build-manager.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release via GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.calc_tag_version.outputs.tag }}"
          
          mkdir -p final-assets
          find release-assets -type f \( -name "*.zip" -o -name "*.apk" \) -exec cp {} final-assets/ \;
          
          gh release create "$TAG_NAME" final-assets/* \
            --title "LinuxxPU Kernel & Manager - $TAG_NAME" \
            --notes "Build otomatis Xiaomi Camellia (${{ inputs.ksu_fork }} | Variant: ${{ inputs.kernel_variant }})." \
            --clobber
            
